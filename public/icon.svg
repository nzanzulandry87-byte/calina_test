<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="calinaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="108" fill="url(#calinaGrad)"/>
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="8"/>
  
  <!-- Architectural / Hardware Store Emblem -->
  <!-- Roof / Warehouse Gable -->
  <polygon points="256,90 390,195 360,195 256,115 152,195 122,195" fill="url(#goldGrad)"/>
  
  <!-- Stylized Letter 'C' & Tools / Gear -->
  <!-- Gear teeth in background of crest -->
  <circle cx="256" cy="275" r="105" fill="none" stroke="#2563eb" stroke-width="24" stroke-dasharray="24 16"/>
  <circle cx="256" cy="275" r="90" fill="#0f2b5c"/>
  
  <!-- Crossed Tool Silhouette: Wrench & Hammer -->
  <path d="M210 215 L302 335 M302 215 L210 335" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Bold C for Calina in Gold -->
  <path d="M295 230 C280 215 255 210 235 220 C210 232 205 265 205 280 C205 310 220 335 250 335 C275 335 295 320 300 300" 
        fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Text CALINA GESTION -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CALINA</text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="6">GESTION QUINCAILLERIE</text>
</svg>
